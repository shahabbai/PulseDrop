<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PulseDrop mark</title>
  <desc id="desc">A neon pulse document and upload arrow mark for PulseDrop.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="62" x2="442" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#103B61"/>
      <stop offset="0.56" stop-color="#071D3B"/>
      <stop offset="1" stop-color="#060B1C"/>
    </linearGradient>
    <linearGradient id="edge" x1="54" y1="54" x2="458" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27F5FF"/>
      <stop offset="0.52" stop-color="#3384FF"/>
      <stop offset="1" stop-color="#8A6CFF"/>
    </linearGradient>
    <linearGradient id="line" x1="146" y1="122" x2="390" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33F6FF"/>
      <stop offset="0.52" stop-color="#39B8FF"/>
      <stop offset="1" stop-color="#2C6BFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#27F5FF" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect x="34" y="34" width="444" height="444" rx="112" fill="url(#bg)"/>
  <rect x="39" y="39" width="434" height="434" rx="107" stroke="url(#edge)" stroke-width="10"/>
  <rect x="88" y="88" width="336" height="336" rx="82" stroke="#27F5FF" stroke-opacity="0.16" stroke-width="4"/>
  <g filter="url(#glow)">
    <path d="M150 112H262L338 188V400H150V112Z" stroke="url(#line)" stroke-width="20" stroke-linejoin="round"/>
    <path d="M262 112V192H338" stroke="url(#line)" stroke-width="20" stroke-linejoin="round"/>
    <path d="M176 288H222L240 226L276 356L300 288H342" stroke="#27F5FF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M352 394V274" stroke="#27F5FF" stroke-width="20" stroke-linecap="round"/>
    <path d="M308 318L352 274L396 318" stroke="#27F5FF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
