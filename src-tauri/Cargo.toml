[package]
name = "pulse_drop"
version = "0.1.0"
description = "Local network file transfer app"
authors = ["PulseDrop"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pulse_drop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.15"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
