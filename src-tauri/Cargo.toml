[package]
name = "pulse_drop"
version = "0.9.1"
description = "Local network file transfer app"
authors = ["PulseDrop"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pulse_drop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
if-addrs = "0.15"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_System_WinRT", "Win32_Security_Cryptography", "Foundation", "Networking_Connectivity", "Networking_NetworkOperators"] }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-updater = "2.12"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }
