name: Set up PulseDrop build
description: Install the shared desktop or Android build toolchain
inputs:
  android:
    description: Install Android SDK and NDK tools
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24'
        cache: npm
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: src-tauri -> target
        key: ${{ runner.os }}-android-${{ inputs.android }}
    - name: Install Linux desktop dependencies
      if: runner.os == 'Linux' && inputs.android != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev \
          libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    - name: Install frontend dependencies
      shell: bash
      run: npm ci
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      if: inputs.android == 'true'
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
        cache-dependency-path: |
          src-tauri/gen/android/**/*.gradle*
          src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      if: inputs.android == 'true'
      with:
        packages: 'platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0 ndk;28.2.13676358'
    - name: Prepare Android project
      if: inputs.android == 'true'
      shell: bash
      run: |
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
        rustup target add aarch64-linux-android
        npm run android:init -- --ci --skip-targets-install
        chmod +x src-tauri/gen/android/gradlew
