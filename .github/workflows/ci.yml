name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'

jobs:
  checks:
    name: Versions and frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - run: npm run frontend:build

  desktop:
    name: ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux DEB
            os: ubuntu-24.04
            bundle: deb
            artifact: linux-deb
            path: src-tauri/target/release/bundle/deb/*.deb
          - name: Windows EXE
            os: windows-2022
            bundle: nsis
            artifact: windows-exe
            path: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build frontend for Rust tests
        run: npm run frontend:build
      - name: Rust tests
        shell: bash
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installer
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          rm -rf src-tauri/target/release/bundle
          npm run tauri -- build --bundles "$BUNDLE" --ci -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android debug APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          android: 'true'
      - run: npm run android:build:debug -- --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 7
