name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'

jobs:
  checks:
    name: Versions and frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - run: npm run frontend:build

  desktop:
    name: ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux DEB
            os: ubuntu-24.04
            bundle: deb
            artifact: linux-deb
            path: src-tauri/target/release/bundle/deb/*.deb
          - name: Windows EXE
            os: windows-2022
            bundle: nsis
            artifact: windows-exe
            path: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build frontend for Rust tests
        run: npm run frontend:build
      - name: Compile Rust tests
        shell: bash
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
      - name: Rust tests
        timeout-minutes: 5
        shell: bash
        run: cargo test --offline --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installer
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          rm -rf src-tauri/target/release/bundle
          npm run tauri -- build --bundles "$BUNDLE" --ci -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS universal test DMG
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Install Apple Silicon and Intel Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build frontend for Rust tests
        run: npm run frontend:build
      - name: Compile Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
      - name: Rust tests on macOS
        timeout-minutes: 5
        run: cargo test --offline --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build ad hoc signed universal DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          rm -rf src-tauri/target/universal-apple-darwin/release/bundle
          # Keep the .app for verification; a dmg-only build deletes it after packaging.
          npm run tauri -- build --target universal-apple-darwin --bundles app,dmg --ci -- --locked
      - name: Verify app signature, architectures, and disk image
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/PulseDrop.app"
          plutil -lint "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocationUsageDescription' "$app/Contents/Info.plist"
          binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          # -verify_arch consumes the following arguments as architecture names.
          lipo "$app/Contents/MacOS/$binary" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android debug APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          android: 'true'
      - run: npm run android:build:debug -- --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 7
