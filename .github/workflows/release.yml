name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'

jobs:
  checks:
    name: Validate release version and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check tag against every manifest
        id: version
        run: npm run version:check -- "$GITHUB_REF_NAME"
      - name: Require the release changelog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs "$RELEASE_VERSION" > /dev/null
      - run: npm test
      - run: npm run frontend:build

  desktop:
    name: ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux DEB
            os: ubuntu-24.04
            bundle: deb
            artifact: linux-deb
            path: src-tauri/target/release/bundle/deb/*.deb
          - name: Windows EXE
            os: windows-2022
            bundle: nsis
            artifact: windows-exe
            path: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build frontend for Rust tests
        run: npm run frontend:build
      - name: Compile Rust tests
        shell: bash
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
      - name: Rust tests
        timeout-minutes: 5
        shell: bash
        run: cargo test --offline --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installer
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          rm -rf src-tauri/target/release/bundle
          npm run tauri -- build --bundles "$BUNDLE" --ci -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS universal DMG
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Install Apple Silicon and Intel Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build frontend for Rust tests
        run: npm run frontend:build
      - name: Compile Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
      - name: Rust tests on macOS
        timeout-minutes: 5
        run: cargo test --offline --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build ad hoc signed universal DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          rm -rf src-tauri/target/universal-apple-darwin/release/bundle
          # Keep the .app for verification; a dmg-only build deletes it after packaging.
          npm run tauri -- build --target universal-apple-darwin --bundles app,dmg --ci -- --locked
      - name: Verify app signature, architectures, and disk image
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/PulseDrop.app"
          plutil -lint "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Contents/Info.plist"
          binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          # -verify_arch consumes the following arguments as architecture names.
          lipo "$app/Contents/MacOS/$binary" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  android:
    name: Signed Android release APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, binascii, os
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure GitHub repository secrets: ' + ', '.join(missing))
          try:
              data = base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True)
              if not data:
                  raise ValueError('Empty keystore')
          except (binascii.Error, ValueError):
              raise SystemExit('ANDROID_KEYSTORE_BASE64 is invalid. Re-encode your existing keystore and replace the secret with the full Base64 file contents, not its filename or path. See docs/github-releases.md.')
          PY
      - uses: ./.github/actions/setup-build
        with:
          android: 'true'
      - name: Build unsigned release APK
        run: npm run android:build:apk -- --ci
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'pulsedrop-release.jks'
          key.write_bytes(base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True))
          key.chmod(0o600)
          PY
      - name: Align, sign, and verify APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          npm run android:sign:apk -- \
            --ks "$RUNNER_TEMP/pulsedrop-release.jks" \
            --alias "$ANDROID_KEY_ALIAS" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --out "artifacts/PulseDrop_${RELEASE_VERSION}_android_arm64.apk"
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pulsedrop-release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-android-apk
          path: artifacts/*_android_arm64.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish all installers
    needs: [checks, desktop, macos, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Prepare version release notes
        env:
          RELEASE_VERSION: ${{ needs.checks.outputs.version }}
        run: node scripts/release-notes.mjs "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify all platforms and generate checksums
        working-directory: release-assets
        env:
          RELEASE_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for extension in ['deb', 'apk', 'exe', 'dmg']:
              files = list(Path('.').glob('*.' + extension))
              if len(files) != 1:
                  raise SystemExit('Expected exactly one ' + extension + ' installer, found ' + str(len(files)))
              if '_' + os.environ['RELEASE_VERSION'] + '_' not in files[0].name:
                  raise SystemExit('Installer version does not match the release: ' + files[0].name)
          PY
          sha256sum ./*.deb ./*.apk ./*.exe ./*.dmg > SHA256SUMS
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$state" == "false" ]]; then
            echo "This version is already published. Create a new version tag."
            exit 1
          fi
          if [[ "$state" != "true" ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "PulseDrop $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
